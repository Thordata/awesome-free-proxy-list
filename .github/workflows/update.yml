name: update-proxy-list

on:
  workflow_dispatch:
    inputs:
      max_per_type:
        description: "Max candidates per type (smaller = faster test run)"
        required: false
        default: "2000"
      concurrency:
        description: "Max concurrent validations"
        required: false
        default: "200"
  schedule:
    - cron: "15 0 * * *" # daily 00:15 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with refresh.yml: both commit auto-generated data files, so runs are
  # serialized (queued, never cancelled) instead of racing on push.
  group: proxy-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Single job: build → commit → deploy, all on the same runner + working tree.
    # A separate deploy-pages job used to re-checkout@v4, which fetches the SHA the
    # run was *triggered* on — not the fresh commit `build` just pushed — so Pages
    # always lagged one run behind. Keeping deploy inline means we upload the exact
    # docs/ we just generated and committed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update proxies
        env:
          PROXY_TIMEOUT_SEC: "8"
          PROXY_CONCURRENCY: ${{ github.event.inputs.concurrency || '200' }}
          PROXY_MAX_PER_TYPE: ${{ github.event.inputs.max_per_type || '2000' }}
        run: python scripts/update.py

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-summary
          path: |
            proxies/summary.json
            proxies/json/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit changes (if any)
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore: daily proxy list update"
          git add -A
          git commit -m "$MSG"
          OURS=$(git rev-parse HEAD)
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Rebase attempt $i failed; recovering..."
            git rebase --abort 2>/dev/null || true
            # -X theirs only settles content conflicts. write_by_country() deletes
            # and regenerates by-country/*.txt, so a country that died between two
            # runs gives one commit a delete and the other a modify — a
            # modify/delete conflict the strategy option cannot resolve, which
            # makes retrying the same rebase futile. This is the authoritative
            # full scrape, so recover deterministically instead of dropping it:
            # restart from origin/main and replay this run's complete generated
            # dataset (proxies/ + docs/data/) as a fresh commit. A clean tree
            # replay never conflicts. README.md is deliberately not replayed to
            # avoid clobbering concurrent human edits; its stats block
            # self-heals on the next run.
            sleep 5
            git fetch origin main
            git reset --hard origin/main
            git rm -rq --ignore-unmatch proxies docs/data
            git checkout "$OURS" -- proxies
            git checkout "$OURS" -- docs/data || true
            git commit -m "$MSG" || echo "Nothing to replay (origin already matches)."
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Push failed 3 times; failing the run instead of force-pushing over newer data."
          exit 1

      # Deploy from THIS working tree (the one we just generated and committed),
      # not a fresh checkout that would resolve to the run-trigger SHA and lag a
      # cycle behind. Runs unconditionally so a no-op refresh still redeploys the
      # current docs/ (which already matches origin/main).
      - name: Setup Pages
        if: always()
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v5
