name: refresh-proxy-list

# Lightweight re-validation: re-tests only proxies already in proxies/json/ (no
# scraping), so it runs ~5x faster than the daily update. Keeps the list fresher
# than once-a-day given free proxies live for minutes-to-hours.

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours at off-round minutes to spread API load (not :00/:30).
    - cron: "23 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with update.yml: both commit auto-generated data files, so runs are
  # serialized (queued, never cancelled) instead of racing on push.
  group: proxy-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Single job: build → commit → deploy, all on the same runner + working tree.
    # A separate deploy-pages job used to re-checkout@v4, which fetches the SHA the
    # run was *triggered* on — not the fresh commit `build` just pushed — so Pages
    # always lagged one run behind. Keeping deploy inline means we upload the exact
    # docs/ we just generated and committed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Refresh proxies (re-validate existing set only)
        env:
          PROXY_TIMEOUT_SEC: "8"
          PROXY_CONCURRENCY: "200"
        run: python scripts/update.py --refresh

      - name: Commit changes (if any)
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 6h proxy refresh (re-validate existing)"
          # The shared proxy-pipeline concurrency group is supposed to serialize
          # this refresh with the daily update, but runs still overlap now and
          # then (scheduler race). A plain rebase then dies on modify/delete
          # conflicts that -X theirs cannot settle: write_by_country() deletes
          # and regenerates by-country/*.txt, so a country that died between the
          # two runs is "deleted by one commit, modified by the other" — git
          # stops no matter which strategy option is set, so retrying the same
          # rebase 3x always fails (this used to break ~1 run a day). If the
          # rebase fails while origin/main moved, DISCARD this refresh and adopt
          # origin/main: a concurrent full update is a strictly richer dataset
          # (fresh scrape vs this partial re-validation), and replaying our
          # snapshot over it would delete proxies we never tested. Losing ~7
          # minutes of freshness costs nothing; the next cycle re-refreshes.
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~1)" ]; then
              git reset --hard origin/main
              echo "Rebase hit an unresolvable deleted-vs-modified conflict with a newer full update; kept origin/main and skipped this refresh."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed (origin unchanged); retrying..."
          done
          echo "Push failed 3 times; failing the run instead of force-pushing over newer data."
          exit 1

      # Deploy from THIS working tree (the one we just generated and committed),
      # not a fresh checkout that would resolve to the run-trigger SHA and lag a
      # cycle behind. Runs unconditionally so a no-op refresh still redeploys the
      # current docs/ (which already matches origin/main).
      - name: Setup Pages
        if: always()
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v5
