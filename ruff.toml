# Keep the CI lint gate aligned with the codebase's existing style.
line-length = 120
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = [
    "E741", # ambiguous single-char names are fine for ip/port tuples
]

[lint.per-file-ignores]
# subscription.py imports update.py as a local sibling module when run directly
"scripts/subscription.py" = ["E402"]
